<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Language TTS Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .test-container { max-width: 600px; margin: 0 auto; }
        button { padding: 10px 20px; margin: 10px; font-size: 16px; }
        .language-selector { margin: 20px 0; }
        select { padding: 5px; font-size: 16px; }
        .test-text { margin: 20px 0; padding: 15px; background: #f0f0f0; border-radius: 5px; }
        .controls { margin: 20px 0; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🎤 Multi-Language Text-to-Speech Test</h1>
        
        <div class="language-selector">
            <label for="languageSelect">Select Language:</label>
            <select id="languageSelect">
                <option value="en">🇺🇸 English</option>
                <option value="hi">🇮🇳 Hindi</option>
                <option value="ta">🇮🇳 Tamil</option>
                <option value="te">🇮🇳 Telugu</option>
            </select>
        </div>
        
        <div class="test-text">
            <h3>Test Medical Text:</h3>
            <p id="testText">Welcome to the medical assistant. I can help you with health information, symptoms, treatments, and medical advice. Please ask me any medical questions you may have.</p>
        </div>
        
        <div class="controls">
            <button onclick="speakText()">🔊 Speak Text</button>
            <button onclick="stopSpeaking()">⏹️ Stop</button>
            <button onclick="testVoices()">🧪 Test All Languages</button>
        </div>
        
        <div id="status"></div>
        <div id="voiceList"></div>
    </div>

    <script>
        let currentUtterance = null;
        const synthesis = window.speechSynthesis;
        let availableVoices = [];
        
        // Language configurations
        const languages = {
            'en': { code: 'en-US', name: 'English' },
            'hi': { code: 'hi-IN', name: 'Hindi' },
            'ta': { code: 'ta-IN', name: 'Tamil' },
            'te': { code: 'te-IN', name: 'Telugu' }
        };
        
        // Initialize voices
        function loadVoices() {
            availableVoices = synthesis.getVoices();
            console.log('Available voices:', availableVoices.length);
            
            // Display available voices
            const voiceList = document.getElementById('voiceList');
            let html = '<h3>Available Voices by Language:</h3>';
            
            Object.entries(languages).forEach(([key, lang]) => {
                const voices = getVoicesForLanguage(key);
                html += `<h4>${lang.name} (${voices.length} voices):</h4>`;
                if (voices.length > 0) {
                    voices.forEach(voice => {
                        html += `<p>• ${voice.name} (${voice.lang}) ${voice.localService ? '(Local)' : '(Remote)'}</p>`;
                    });
                } else {
                    html += '<p>No voices available</p>';
                }
            });
            
            voiceList.innerHTML = html;
        }
        
        function getVoicesForLanguage(languageKey) {
            const langInfo = languages[languageKey];
            return availableVoices.filter(voice => {
                if (voice.lang === langInfo.code) return true;
                const voiceLangCode = voice.lang.split('-')[0];
                const targetLangCode = langInfo.code.split('-')[0];
                return voiceLangCode === targetLangCode;
            });
        }
        
        function selectBestVoice(languageKey) {
            const voices = getVoicesForLanguage(languageKey);
            if (voices.length === 0) return null;
            
            // Prefer Google voices, then Microsoft, then local
            const priorities = [
                voice => voice.name.includes('Google'),
                voice => voice.name.includes('Microsoft'),
                voice => voice.localService,
                voice => true
            ];
            
            for (let priority of priorities) {
                const voice = voices.find(priority);
                if (voice) return voice;
            }
            
            return voices[0];
        }
        
        function speakText() {
            const text = document.getElementById('testText').textContent;
            const selectedLang = document.getElementById('languageSelect').value;
            const langInfo = languages[selectedLang];
            
            // Stop any current speech
            synthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = langInfo.code;
            
            // Select best voice
            const voice = selectBestVoice(selectedLang);
            if (voice) {
                utterance.voice = voice;
                console.log(`Using voice: ${voice.name} (${voice.lang})`);
            }
            
            // Configure speech settings
            utterance.rate = 0.8;
            utterance.pitch = 1.0;
            utterance.volume = 0.9;
            
            utterance.onstart = () => {
                document.getElementById('status').innerHTML = `🔊 Speaking in ${langInfo.name}...`;
                console.log(`Started speaking in ${langInfo.name}`);
            };
            
            utterance.onend = () => {
                document.getElementById('status').innerHTML = `✅ Finished speaking in ${langInfo.name}`;
                console.log(`Finished speaking in ${langInfo.name}`);
            };
            
            utterance.onerror = (event) => {
                document.getElementById('status').innerHTML = `❌ Error speaking in ${langInfo.name}: ${event.error}`;
                console.error('Speech error:', event);
            };
            
            currentUtterance = utterance;
            synthesis.speak(utterance);
        }
        
        function stopSpeaking() {
            synthesis.cancel();
            document.getElementById('status').innerHTML = '⏹️ Speech stopped';
        }
        
        function testAllLanguages() {
            const languages_to_test = ['en', 'hi', 'ta', 'te'];
            let index = 0;
            
            function testNext() {
                if (index >= languages_to_test.length) {
                    document.getElementById('status').innerHTML = '✅ All language tests completed';
                    return;
                }
                
                const langKey = languages_to_test[index];
                const langInfo = languages[langKey];
                document.getElementById('languageSelect').value = langKey;
                
                const testText = `Testing ${langInfo.name} text to speech functionality.`;
                
                const utterance = new SpeechSynthesisUtterance(testText);
                utterance.lang = langInfo.code;
                
                const voice = selectBestVoice(langKey);
                if (voice) {
                    utterance.voice = voice;
                }
                
                utterance.rate = 0.8;
                utterance.pitch = 1.0;
                utterance.volume = 0.9;
                
                utterance.onstart = () => {
                    document.getElementById('status').innerHTML = `🧪 Testing ${langInfo.name} (${index + 1}/${languages_to_test.length})`;
                };
                
                utterance.onend = () => {
                    index++;
                    setTimeout(testNext, 1000); // Wait 1 second between tests
                };
                
                utterance.onerror = () => {
                    index++;
                    setTimeout(testNext, 1000);
                };
                
                synthesis.speak(utterance);
            }
            
            testNext();
        }
        
        // Load voices when available
        if (synthesis.getVoices().length === 0) {
            synthesis.addEventListener('voiceschanged', loadVoices);
        } else {
            loadVoices();
        }
        
        // Load voices on page load
        window.addEventListener('load', () => {
            setTimeout(loadVoices, 500);
        });
    </script>
</body>
</html>
